name: CI

# Every push: go vet, tests, build, gitleaks history scan, compose validation, image
# build and smoke test. A v* tag push additionally publishes the image to GHCR; only
# that job gets packages: write.
# No workflow uploads artifacts; caches are kept small (Go cache, min-mode Docker layer cache).

on:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/azthrun/dreambig-nas-file-api
  # docker/build-push-action would otherwise upload a build record artifact.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/nas-file-api

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file, and check it publishes no host port (ADR-0002)
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml config --format json \
            | jq -e '[.services[] | select(has("ports"))] | length == 0' > /dev/null \
            || { echo "compose.yaml publishes a host port" >&2; exit 1; }
          rm .env

      - uses: docker/setup-buildx-action@v4

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=min

      - name: Smoke test image
        run: scripts/smoke-test.sh "$IMAGE:ci"

  publish:
    needs: [image, secrets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-release tags (v1.2.3-rc1) get the version and sha tags but never move :latest.
      - name: Image tags
        id: tags
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:sha-${GITHUB_SHA::7}"
            if [[ "$VERSION" != *-* ]]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Same commit and layer cache as the tested image job, so this is a cache-hit rebuild.
      - name: Build and push image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=image
